name: Package Worker Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build and obfuscate
        run: |
          npm run build:obfuscate
          echo "✅ 构建和混淆完成"

      - name: Verify output
        run: |
          if [ ! -f "_worker.js" ]; then
            echo "错误：_worker.js 未生成"
            exit 1
          fi
          echo "✅ _worker.js 大小: $(wc -c < _worker.js) 字节"

      - name: Create Pages deployment zip
        run: |
          zip -j Pages.zip _worker.js wrangler.toml
          echo "✅ Pages.zip 已创建"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## CFnew Pages 部署包

            - 包含混淆后的 `_worker.js` + `wrangler.toml`
            - 上传到 Cloudflare Pages 即可部署
            - 记得在面板中设置 uuid 等环境变量
          files: Pages.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output summary
        run: |
          echo "## 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "- 构建产物: _worker.js" >> $GITHUB_STEP_SUMMARY
          echo "- 压缩包: Pages.zip" >> $GITHUB_STEP_SUMMARY
          echo "- 标签: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
