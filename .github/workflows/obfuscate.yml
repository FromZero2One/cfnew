name: Build and Obfuscate Worker Script

on:
  workflow_dispatch:
  push:
    branches:
      - 'refactor/simplify-v2'
      - 'simplify-v2'
    paths:
      - 'src/**'
      - 'package.json'

jobs:
  build-and-obfuscate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build and obfuscate
        run: |
          npm run build:obfuscate
          echo "构建和混淆完成"

      - name: Commit and push the obfuscated file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f _worker.js
          if git diff --staged --quiet; then
            echo "No changes to commit, the obfuscated file is already up-to-date."
          else
            git commit -m "部署用这个"
            git push
          fi
